# Vigia do domínio e do site: a cada 6 horas confere se o domínio está ativo
# (não suspenso, DNS certo, longe do vencimento), se o site e o blog estão no ar
# e se o SSL é válido. Se algo falhar, o GitHub envia e-mail automaticamente.
# Guia: docs/hospedagem-e-dominio.md
name: Vigia do domínio

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Conferir domínio, DNS, site e SSL
        env:
          NS_ESPERADOS: ${{ vars.NS_ESPERADOS }}
        run: node scripts/monitorar-dominio.mjs
